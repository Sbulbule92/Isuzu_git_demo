trigger:
  branches:
    include:
      - qa

pool:
  name: Default

variables:
  IGNITION_PROJECT_PATH: zbl_printer
  CONTAINER_NAME: ignitiondocker-frontend-1
  IGNITION_DATA_DIR: /usr/local/bin/ignition/data/projects

steps:
# 1. Checkout repo
- checkout: self

# 2. Debug variables
- script: |
    echo "SourcesDirectory: $(Build.SourcesDirectory)"
    echo "Project Path: $(IGNITION_PROJECT_PATH)"
    echo "Container Name: $(CONTAINER_NAME)"
    echo "Ignition Data Dir: $(IGNITION_DATA_DIR)"
  displayName: Debug Variables

# 3. Copy project into running container

- task: PowerShell@2
  displayName: Copy Test_Project into Ignition Container
  inputs:
    targetType: inline
    pwsh: false
    script: |
      $ErrorActionPreference = "Stop"

      $projectName = "$(IGNITION_PROJECT_PATH)"
      $container   = "$(CONTAINER_NAME)"
      $dataDir     = "$(IGNITION_DATA_DIR)"

      $source = "$(Build.SourcesDirectory)\projects\$projectName"
      $dest   = "$dataDir/$projectName"
      $dockerDest = "${container}:$dest"

      Write-Host "Deploying Ignition project: $projectName"
      Write-Host "Source: $source"
      Write-Host "Destination: $dockerDest"

      if (!(Test-Path $source)) {
          throw "Project not found at: $source"
      }

      # Remove existing project
      docker exec $container rm -rf $dest

      # Copy project
      docker cp "$source" "$dockerDest"

      # Restart gateway (clean way)
      docker exec --user root ignitiondocker-frontend-1 /usr/local/bin/ignition/gwcmd.sh -r

      Write-Host "Test_Project deployed successfully"


